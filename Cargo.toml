[package]
name = "sr5900p"
version = "0.1.0"
edition = "2021"

[features]
default = ["cli", "svg"]
# the sr5900p command; library users can opt out with default-features = false
cli = ["dep:anyhow", "dep:argh", "dep:env_logger"]
# SVG logos (Logo::Svg, Logo::from_svg); pulls in resvg and its font and image decoders
svg = ["dep:resvg"]

[[bin]]
name = "sr5900p"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = { version = "1.0.104", optional = true }
argh = { version = "0.1.19", optional = true }
barcoders = { version = "2.0.0", default-features = false }
datamatrix = "0.3.3"
embedded-graphics = "0.8.2"
env_logger = { version = "0.11.11", default-features = false, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
png = "0.18.1"
qrcode = "0.14.1"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "raster-images"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
anyhow = "1.0.104"
