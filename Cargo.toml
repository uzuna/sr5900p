[package]
name = "sr5900p"
version = "0.1.0"
edition = "2021"

[features]
default = ["cli"]
# the sr5900p command; library users can opt out with default-features = false
cli = ["dep:argh", "dep:env_logger"]

[[bin]]
name = "sr5900p"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
argh = { version = "0.1.19", optional = true }
barcoders = { version = "2.0.0", default-features = false }
datamatrix = "0.3.3"
embedded-graphics = "0.8.2"
env_logger = { version = "0.11.11", default-features = false, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
png = "0.18.1"
qrcode = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
