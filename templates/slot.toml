# 棚スロット: 棚スロットID / 配置可能種別 + スロットIDのQR
[fonts]
bold = { path = "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc" }
medium = { path = "/usr/share/fonts/opentype/noto/NotoSansCJK-Medium.ttc" }

[[columns]]
type = "text"
lines = [
  { text = "{slot_id}", font = "bold", size = 0.6 },
  { text = "種別: {kinds}", font = "medium", size = 0.38 },
]

[[columns]]
type = "qr"
data = "{slot_id}"
